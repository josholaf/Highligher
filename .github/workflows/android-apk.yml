name: Build debug APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version_name:
        description: "App version name (for example, 1.0.2)"
        required: true
        default: "1.0.2"
        type: string
      version_code:
        description: "Android version code (must be higher than the previous release)"
        required: true
        default: "4"
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highligher-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build versioned debug APK
        id: build_apk
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
              echo "Invalid version name: $VERSION_NAME"
              exit 1
            fi

            if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
              echo "Version code must be a positive integer."
              exit 1
            fi

            gradle assembleDebug \
              -PappVersionName="$VERSION_NAME" \
              -PappVersionCode="$VERSION_CODE" \
              --no-daemon
          else
            VERSION_NAME="$(grep -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
            gradle assembleDebug --no-daemon
          fi

          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          APK_NAME="Highligher-v${VERSION_NAME}-debug.apk"
          cp "$APK_SOURCE" "app/build/outputs/apk/debug/$APK_NAME"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=app/build/outputs/apk/debug/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "Built $APK_NAME"

      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: highligher-v${{ steps.build_apk.outputs.version_name }}-debug
          path: ${{ steps.build_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
