name: Build debug APK

on:
  push:
    branches: [main]
    tags: ["v*", "!v*-signed"]
  pull_request:
  workflow_dispatch:
    inputs:
      version_name:
        description: "App version name (for example, 1.0.2)"
        required: true
        default: "1.0.2"
        type: string
      version_code:
        description: "Android version code"
        required: true
        default: "4"
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highligher-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build debug APK
        id: build_apk
        shell: bash
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION_NAME="$INPUT_VERSION_NAME"
            VERSION_CODE="$INPUT_VERSION_CODE"

            if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
              echo "Invalid version name: $VERSION_NAME"
              exit 1
            fi

            if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
              echo "Version code must be a positive integer."
              exit 1
            fi

            gradle assembleDebug \
              -PappVersionName="$VERSION_NAME" \
              -PappVersionCode="$VERSION_CODE" \
              --no-daemon

            APK_NAME="Highligher-v${VERSION_NAME}-debug.apk"
            ARTIFACT_NAME="highligher-v${VERSION_NAME}-debug"
          else
            # Version comes from app/build.gradle.kts defaults, no duplication here.
            gradle assembleDebug --no-daemon
            APK_NAME="Highligher-debug-${GITHUB_SHA::7}.apk"
            ARTIFACT_NAME="highligher-debug-${GITHUB_SHA::7}"
          fi

          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          APK_PATH="app/build/outputs/apk/debug/$APK_NAME"
          cp "$APK_SOURCE" "$APK_PATH"

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "Built $APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_apk.outputs.artifact }}
          path: ${{ steps.build_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
