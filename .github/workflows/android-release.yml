name: Build signed release APK

on:
  push:
    tags:
      - "v*-signed"
    branches:
      - "v*-signed"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v1.0.2-signed"
        required: true
        default: "v1.0.2-signed"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check Android signing secrets
        id: secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::warning::Missing GitHub Actions secret: ${secret_name}"
              missing=1
            fi
          done
          if [[ $missing -eq 1 ]]; then
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured. Skipping signed build."
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Decode Android signing keystore
        if: steps.secrets.outputs.has_secrets == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_FILE: release.keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "app/$ANDROID_KEYSTORE_FILE"
          chmod 600 "app/$ANDROID_KEYSTORE_FILE"
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Build signed release APK
        if: steps.secrets.outputs.has_secrets == 'true'
        env:
          ANDROID_KEYSTORE_FILE: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Verify APK signature and prepare release asset
        if: steps.secrets.outputs.has_secrets == 'true'
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          cp "$APK" "Highligher-$TAG.apk"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Remove decoded keystore
        if: always() && steps.secrets.outputs.has_secrets == 'true'
        env:
          ANDROID_KEYSTORE_FILE: release.keystore
        run: rm -f "app/$ANDROID_KEYSTORE_FILE"
      - name: Upload release APK artifact
        if: steps.secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: highligher-signed-release-apk
          path: Highligher-*.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Release
        if: steps.secrets.outputs.has_secrets == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: Highligher ${{ steps.prep.outputs.tag }}
          body: |
            Highligher signed release.

            - Signed release APK for direct installation.
            - Offline-first Markdown notes with folder tree and full-library search.
            - Capture highlights from any app via text selection.
            - Minimum Android version: Android 8.0 (API 26).

            Download **Highligher-${{ steps.prep.outputs.tag }}.apk** below.
          draft: false
          prerelease: false
          files: Highligher-*.apk
      - name: Secrets missing notice
        if: steps.secrets.outputs.has_secrets != 'true'
        run: |
          echo "::notice::Signed release skipped because Android signing secrets are not set."
          echo "Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD to repository secrets to enable signing."
